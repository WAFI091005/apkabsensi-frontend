<!DOCTYPE html>
<html>
<head>
  <title>Scan QR</title>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      background: #f0f0f0;
    }
    h2 {
      margin: 20px 0;
    }
    video {
      width: 100%;
      max-width: 400px;
      border: 4px solid #00b894;
      border-radius: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 16px;
      color: #2d3436;
      background: #dfe6e9;
      padding: 10px 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>📷 Arahkan Kamera ke QR Code</h2>
  <video id="preview" autoplay></video>
  <div id="result">🔍 Menunggu scan...</div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    const resultBox = document.getElementById("result");
    const video = document.getElementById("preview");

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function(stream) {
        video.srcObject = stream;
      })
      .catch(function(err) {
        resultBox.innerText = "❌ Gagal membuka kamera: " + err.message;
      });

    const codeReader = new Html5Qrcode("preview");
    codeReader.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      (decodedText) => {
        resultBox.innerText = "✅ QR Code: " + decodedText;
        codeReader.stop();
      },
      (error) => {}
    );
  </script>
</body>
</html>
